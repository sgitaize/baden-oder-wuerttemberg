<!DOCTYPE html>
<!-- Vorlage für public/assets/og.png (1200×630). Erzeugen:
     chromium --headless --no-sandbox --hide-scrollbars --window-size=1200,630 --screenshot=public/assets/og.png build/og.html -->
<html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../public/assets/fonts.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #151719; color: #ebe5d6; font-family: "Barlow Condensed", sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; }
  .q { font-size: 64px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
  .sign { background: #f5c400; border-radius: 22px; padding: 14px; box-shadow: 0 0 0 3px #111; }
  .in { border: 8px solid #111; border-radius: 12px; padding: 6px 48px 14px; text-align: center; color: #111; }
  .name { font-size: 104px; font-weight: 700; line-height: 1.05; white-space: nowrap; }
  .sub { font-size: 40px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; border-top: 5px solid #111; padding-top: 6px; }
  .url { font-family: "IBM Plex Mono", monospace; font-size: 30px; color: #b9b2a2; }
</style></head>
<body>
  <div class="q">Wo lag dein Ort vor 1945?</div>
  <div class="sign"><div class="in"><div class="name">Baden oder Württemberg</div><div class="sub">Baden · Württemberg · Hohenzollern</div></div></div>
  <div class="url">baden-oder-württemberg.de</div>
</body></html>
